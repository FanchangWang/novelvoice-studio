[project]
name = "novelvoice-studio"
version = "0.4.0"
description = "本地 AI 多角色有声小说制作系统"
readme = "README.md"
authors = [
    { name = "FanchangWang" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "charset-normalizer>=3.3",
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "soundfile>=0.12",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
novelvoice-studio = "novelvoice_studio.__main__:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:alembic.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
]