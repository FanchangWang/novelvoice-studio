[project]
name = "novelvoice-cosyvoice-worker"
version = "0.1.0"
description = "NovelVoice Studio POC worker: CosyVoice3 TTS"
requires-python = ">=3.10,<3.11"
dependencies = [
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "fastapi==0.115.6",
    "fastapi-cli==0.0.4",
    "gdown==5.1.0",
    "gradio==5.4.0",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime==1.18.0",
    "openai-whisper==20231117",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "setuptools==80.9.0",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "torch==2.3.1+cu121",
    "torchaudio==2.3.1+cu121",
    "transformers==4.51.3",
    "uvicorn==0.30.0",
    "wetext==0.0.7",
    "wget==3.2",
    "x-transformers==2.11.24",
]

[tool.uv]
package = false
# openai-whisper 20231117 在 Windows 上构建需要旧版 setuptools，且不支持隔离构建。
no-build-isolation-package = ["openai-whisper"]
# 仅针对本机 Windows x64 解析，避免无关平台的依赖分支。
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# 阿里云 PyTorch 镜像是扁平 wheel 目录（非 PEP 503），用 find-links 提供候选。
find-links = ["https://mirrors.aliyun.com/pytorch-wheels/cu121/"]
